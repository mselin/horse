name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Site checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Validate HTML
        run: git ls-files -z '*.html' | xargs -0 npx --yes html-validate@11.21.1

  build:
    name: Build and browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Loads the built site in headless Chromium (software WebGL): the mesh bakes in its worker, the horse
      # canters for a moment and one frame renders. Any page or console error fails the job.
      - run: npm run test:smoke

  # The one check that branch protection requires, so jobs can be added or renamed
  # above without touching the repository settings.
  ok:
    name: All checks passed
    if: always()
    needs: [site, build]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail unless every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1

  # After every check passes on main: publish the built site with GitHub Pages, at https://mselin.github.io/horse/.
  # (The repository's Pages source has to be "GitHub Actions".)
  pages:
    name: Publish the horse
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [ok]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      # (whichever try deployed it)
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_again.outputs.page_url || steps.deploy_last.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      # The deploy step sometimes cannot find the artifact it was handed a moment before (the run's artifact
      # list lags), so it gets three tries with waits in between; the job fails only if the last one does.
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Wait before the second try
        if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy_again
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Wait before the last try
        if: steps.deploy_again.outcome == 'failure'
        run: sleep 90
      - id: deploy_last
        if: steps.deploy_again.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
